<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Azure AI Vision Analyzer CI-CD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: #f5f7fb;
        }

        .main-card{
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .preview-image{
            max-width: 100%;
            border-radius: 15px;
            margin-top: 20px;
        }

        .tag-badge{
            margin: 5px;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card main-card p-4">

                    <h1 class="text-center mb-4">
                        Azure AI Vision Analyzer
                    </h1>

                    <form method="POST" enctype="multipart/form-data">

                        <div class="mb-3">

                            <input
                                class="form-control"
                                type="file"
                                name="image"
                                required
                            >

                        </div>

                        <div class="d-grid">

                            <button class="btn btn-primary btn-lg">
                                Analyze Image
                            </button>

                        </div>

                    </form>

                    {% if result %}

                        <hr class="my-4">

                        {% if result.image %}
                            <img
                                src="{{ result.image }}"
                                class="preview-image"
                            >
                        {% endif %}

                        <div class="mt-4">

                            <h3>Caption</h3>

                            <div class="alert alert-info">
                                {{ result.caption }}
                            </div>

                        </div>

                        <div class="mt-4">

                            <h3>Tags</h3>

                            {% for tag in result.tags %}

                                <span class="badge bg-primary tag-badge">
                                    {{ tag }}
                                </span>

                            {% endfor %}

                        </div>

                        <div class="mt-4">

                            <h3>Objects Detected</h3>

                            <ul class="list-group">

                                {% for obj in result.objects %}

                                    <li class="list-group-item">
                                        {{ obj }}
                                    </li>

                                {% endfor %}

                            </ul>

                        </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</body>

</html>
